<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base scale" name="Spacing Scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;display:flex;align-items:flex-end;gap:16px;padding:20px;background:var(--surface-bg);font-family:var(--font-body)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">8</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">12</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">16</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-5);height:var(--space-5);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">24</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">32</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-7);height:var(--space-7);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">48</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--green-700)"></div><span style="font-size:11px;color:var(--text-muted)">64</span></div>
</div>
