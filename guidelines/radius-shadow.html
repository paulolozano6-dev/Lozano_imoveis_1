<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Corner radius + card shadow" name="Radius & Shadow" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:160px;display:flex;align-items:center;gap:24px;padding:20px;background:var(--surface-bg);font-family:var(--font-body)">
  <div style="width:80px;height:80px;background:var(--surface-card);border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">sm 4</div>
  <div style="width:80px;height:80px;background:var(--surface-card);border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">md 8</div>
  <div style="width:80px;height:80px;background:var(--surface-card);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">lg 16</div>
  <div style="width:120px;height:80px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">shadow-card</div>
