<!-- @dsCard group="Print" viewport="760x260" subtitle="Business card front + back" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--surface-bg);padding:24px"></div>
<script type="text/babel">
  const { BusinessCard } = window.LozanoDS;
  function Demo() {
    return (
      <div style={{ display: 'flex', gap: 24 }}>
        <div style={{ borderRadius: 8, overflow: 'hidden', boxShadow: 'var(--shadow-card)' }}><BusinessCard side="front" /></div>
        <div style={{ borderRadius: 8, overflow: 'hidden', boxShadow: 'var(--shadow-card)' }}><BusinessCard side="back" /></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
